{% extends 'app/base.html' %}
{% block content %}

<style>
  .bg-cover {
    background-image: url('https://images.unsplash.com/photo-1576091160550-2173dba999ef?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    padding: 2rem 0;
  }
  
  .upload-container {
    max-width: 500px;
    margin: 2rem auto;
    padding: 2.5rem;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    position: relative;
    overflow: hidden;
  }
  
  .upload-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #10b981, #3b82f6, #10b981);
  }
  
  .preview-container {
    width: 220px;
    height: 220px;
    margin: 0 auto 2rem;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid white;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    position: relative;
    transition: all 0.3s ease;
  }
  
  .preview-container:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
  }
  
  .file-input-label {
    display: block;
    padding: 0.85rem 1.75rem;
    background: linear-gradient(to right, #10b981, #3b82f6);
    color: white;
    border-radius: 9999px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 1.5rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
  }
  
  .file-input-label:hover {
    background: linear-gradient(to right, #0ea472, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
  }
  
  .file-input {
    display: none;
  }
  
  .submit-btn {
    background: linear-gradient(to right, #10b981, #3b82f6);
    color: white;
    padding: 0.85rem 1.75rem;
    border-radius: 9999px;
    border: none;
    width: 100%;
    font-weight: 600;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    margin-top: 0.5rem;
  }
  
  .submit-btn:hover {
    background: linear-gradient(to right, #0ea472, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
  }
  
  .cancel-link {
    color: #6b7280;
    transition: all 0.2s ease;
    display: inline-block;
    margin-top: 1.5rem;
  }
  
  .cancel-link:hover {
    color: #374151;
    transform: translateY(-1px);
  }
  
  .title {
    color: #111827;
    margin-bottom: 2rem;
    position: relative;
    display: inline-block;
  }
  
  .title::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(to right, #10b981, #3b82f6);
    border-radius: 3px;
  }
  
  @media (max-width: 640px) {
    .upload-container {
      padding: 2rem 1.5rem;
      margin: 1rem;
    }
    
    .preview-container {
      width: 180px;
      height: 180px;
    }
  }
</style>

<div class="bg-cover min-h-screen flex items-center">
  <div class="upload-container">
    <h2 class="text-3xl font-bold text-center title">Update Your Profile Picture</h2>
    
    <div class="preview-container">
      {% if doctor.profile_picture and doctor.profile_picture.url %}
        <img src="{{ doctor.profile_picture.url }}" alt="Current Profile Picture" id="image-preview" class="w-full h-full object-cover">
      {% else %}
        <div class="w-full h-full bg-gray-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
      {% endif %}
    </div>
    
    <form method="POST" action="{% url 'profile_picture_update' %}" enctype="multipart/form-data">
      {% csrf_token %}
      
      <label for="id_profile_picture" class="file-input-label">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        Choose New Photo
      </label>
      {{ form.profile_picture }}
      
      <button type="submit" class="submit-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-1 -mt-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Save Changes
      </button>
      
      <div class="text-center">
        <a href="{% url 'profile' %}" class="cancel-link">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('id_profile_picture');
    const preview = document.getElementById('image-preview') || 
                   document.querySelector('.preview-container div');
    
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    // Create image if it doesn't exist
                    if (!document.getElementById('image-preview')) {
                        const container = document.querySelector('.preview-container');
                        container.innerHTML = `
                            <img src="${event.target.result}" alt="Preview" 
                                 id="image-preview" class="w-full h-full object-cover">
                        `;
                    } else {
                        document.getElementById('image-preview').src = event.target.result;
                    }
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    }
});
</script>

{% endblock %}
