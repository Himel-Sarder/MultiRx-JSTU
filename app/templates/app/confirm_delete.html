{% extends 'app/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md overflow-hidden">
  <div class="p-8">
    <!-- Warning Icon -->
    <div class="flex justify-center mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-2">Confirm Deletion</h2>
    
    <!-- Message -->
    <p class="text-gray-600 text-center mb-6">
      Are you sure you want to permanently delete patient 
      <span class="font-semibold text-red-600">{{ patient.name }}</span>?
    </p>
    <p class="text-sm text-gray-500 text-center mb-8">
      This action cannot be undone.
    </p>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <form method="post" class="w-full sm:w-auto">
        {% csrf_token %}
        <button type="submit" 
                class="w-full px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg shadow-md transition duration-200 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
          Delete Permanently
        </button>
      </form>
      
      <a href="{% url 'search' %}" 
         class="w-full sm:w-auto px-6 py-3 border border-gray-300 hover:border-gray-400 text-gray-700 font-medium rounded-lg shadow-sm transition duration-200 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 text-center">
        Cancel
      </a>
    </div>
  </div>
</div>

<style>
  body {
    background-color: #f9fafb;
  }
</style>
{% endblock %}
