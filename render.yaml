services:
  - type: web
    name: multirx
    env: python

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate

    startCommand: gunicorn multirx.wsgi:application

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: multirx.settings

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: multirx_db
          property: connectionString

databases:
  - name: multirx_db
    plan: free
